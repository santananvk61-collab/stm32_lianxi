<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>OLED 右上角格子居中预览</title>
<style>
  body{font-family:"Microsoft YaHei",Arial,sans-serif;background:#f5f5f5;color:#222;margin:20px;}
  h2{margin:0 0 4px;font-size:18px;}
  .sub{color:#666;font-size:13px;margin-bottom:14px;}
  .wrap{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;}
  canvas{background:#000;border:2px solid #333;border-radius:4px;image-rendering:pixelated;}
  .panel{width:300px;font-size:13px;line-height:1.7;}
  .panel label{display:block;margin:10px 0 2px;font-weight:bold;}
  input[type=range]{width:100%;}
  .val{color:#c00;font-weight:bold;}
  table{border-collapse:collapse;margin-top:10px;font-size:12.5px;}
  td,th{border:1px solid #ccc;padding:3px 8px;}
  th{background:#eee;}
  .ok{color:#1a9e1a;font-weight:bold;}
  .bad{color:#c00;}
  button{margin-top:10px;padding:6px 12px;font-size:13px;cursor:pointer;border:1px solid #888;background:#fff;border-radius:4px;}
  button:hover{background:#eee;}
  .legend{font-size:12px;margin-top:8px;}
  .sw{display:inline-block;width:12px;height:12px;vertical-align:middle;margin-right:4px;border-radius:2px;}
</style>
</head>
<body>
<h2>SSD1306 OLED · 右上角格子文字居中对齐预览</h2>
<div class="sub">屏幕 128×64，字体 5×7（每字符占 6×7 像素）。你划的格子：竖线 x=42，横线 y=31。右上角格子 = x[42,127] × y[0,31]。</div>
<div class="wrap">
  <canvas id="cv" width="640" height="320"></canvas>
  <div class="panel">
    <label>光标 X（左→右）：<span class="val" id="vx">52</span></label>
    <input type="range" id="sx" min="42" max="120" value="52">
    <label>光标 Y（上→下）：<span class="val" id="vy">12</span></label>
    <input type="range" id="sy" min="0" max="30" value="12">
    <button id="center">一键居中 (52, 12)</button>

    <table>
      <tr><th>项目</th><th>数值</th></tr>
      <tr><td>文字宽度</td><td>65 px（11字符×6−1）</td></tr>
      <tr><td>文字高度</td><td>7 px</td></tr>
      <tr><td>文字左沿</td><td>X = <span id="tL"></span></td></tr>
      <tr><td>文字右沿</td><td>X = <span id="tR"></span></td></tr>
      <tr><td>文字上沿</td><td>Y = <span id="tT"></span></td></tr>
      <tr><td>文字下沿</td><td>Y = <span id="tB"></span></td></tr>
      <tr><td>左边距(距竖线42)</td><td id="mL"></td></tr>
      <tr><td>右边距(距竖线127)</td><td id="mR"></td></tr>
      <tr><td>上边距(距顶0)</td><td id="mT"></td></tr>
      <tr><td>下边距(距横线31)</td><td id="mB"></td></tr>
    </table>

    <div class="legend">
      <div><span class="sw" style="background:#fff"></span>你输入的文字（当前光标位置）</div>
      <div><span class="sw" style="background:#666"></span>原来代码里的位置 (44,2) 残影</div>
      <div><span class="sw" style="background:#2ce"></span>格子中心十字标 (84.5, 15.5)</div>
      <div><span class="sw" style="background:#fa3"></span>文字包围框</div>
    </div>
  </div>
</div>

<script>
// 与你 oled.c 里完全一致的 5x7 字库（0x20~0x7E）
const Font5x7 = [
[0x00,0x00,0x00,0x00,0x00],[0x00,0x00,0x5F,0x00,0x00],[0x00,0x07,0x00,0x07,0x00],[0x14,0x7F,0x14,0x7F,0x14],
[0x24,0x2A,0x7F,0x2A,0x12],[0x23,0x13,0x08,0x64,0x62],[0x36,0x49,0x55,0x22,0x50],[0x00,0x05,0x03,0x00,0x00],
[0x00,0x1C,0x22,0x41,0x00],[0x00,0x41,0x22,0x1C,0x00],[0x14,0x08,0x3E,0x08,0x14],[0x08,0x08,0x3E,0x08,0x08],
[0x00,0x50,0x30,0x00,0x00],[0x08,0x08,0x08,0x08,0x08],[0x00,0x60,0x60,0x00,0x00],[0x20,0x10,0x08,0x04,0x02],
[0x3E,0x51,0x49,0x45,0x3E],[0x00,0x42,0x7F,0x40,0x00],[0x42,0x61,0x51,0x49,0x46],[0x21,0x41,0x45,0x4B,0x31],
[0x18,0x14,0x12,0x7F,0x10],[0x27,0x45,0x45,0x45,0x39],[0x3C,0x4A,0x49,0x49,0x30],[0x01,0x71,0x09,0x05,0x03],
[0x36,0x49,0x49,0x49,0x36],[0x06,0x49,0x49,0x29,0x1E],[0x00,0x36,0x36,0x00,0x00],[0x00,0x56,0x36,0x00,0x00],
[0x00,0x08,0x14,0x22,0x41],[0x14,0x14,0x14,0x14,0x14],[0x41,0x22,0x14,0x08,0x00],[0x02,0x01,0x51,0x09,0x06],
[0x32,0x49,0x79,0x41,0x3E],[0x7E,0x11,0x11,0x11,0x7E],[0x7F,0x49,0x49,0x49,0x36],[0x3E,0x41,0x41,0x41,0x22],
[0x7F,0x41,0x41,0x41,0x3E],[0x7F,0x49,0x49,0x49,0x41],[0x7F,0x09,0x09,0x09,0x01],[0x3E,0x41,0x49,0x49,0x7A],
[0x7F,0x08,0x08,0x08,0x7F],[0x00,0x41,0x7F,0x41,0x00],[0x20,0x40,0x41,0x3F,0x01],[0x7F,0x08,0x14,0x22,0x41],
[0x7F,0x40,0x40,0x40,0x40],[0x7F,0x02,0x04,0x02,0x7F],[0x7F,0x04,0x08,0x10,0x7F],[0x3E,0x41,0x41,0x41,0x3E],
[0x7F,0x09,0x09,0x09,0x06],[0x3E,0x41,0x51,0x21,0x5E],[0x7F,0x09,0x19,0x29,0x46],[0x46,0x49,0x49,0x49,0x31],
[0x01,0x01,0x7F,0x01,0x01],[0x3F,0x40,0x40,0x40,0x3F],[0x1F,0x20,0x40,0x20,0x1F],[0x3F,0x40,0x38,0x40,0x3F],
[0x63,0x14,0x08,0x14,0x63],[0x07,0x08,0x70,0x08,0x07],[0x61,0x51,0x49,0x45,0x43],[0x00,0x7F,0x41,0x41,0x00],
[0x02,0x04,0x08,0x10,0x20],[0x00,0x41,0x41,0x7F,0x00],[0x04,0x02,0x01,0x02,0x04],[0x40,0x40,0x40,0x40,0x40],
[0x00,0x01,0x02,0x04,0x00],[0x20,0x54,0x54,0x54,0x78],[0x7F,0x48,0x44,0x44,0x38],[0x38,0x44,0x44,0x44,0x20],
[0x38,0x44,0x44,0x48,0x7F],[0x38,0x54,0x54,0x54,0x18],[0x08,0x7E,0x09,0x01,0x02],[0x0C,0x52,0x52,0x52,0x3E],
[0x7F,0x08,0x04,0x04,0x78],[0x00,0x44,0x7D,0x40,0x00],[0x20,0x40,0x44,0x3D,0x00],[0x7F,0x10,0x28,0x44,0x00],
[0x00,0x41,0x7F,0x40,0x00],[0x7C,0x04,0x18,0x04,0x78],[0x7C,0x08,0x04,0x04,0x78],[0x38,0x44,0x44,0x44,0x38],
[0x7C,0x14,0x14,0x14,0x08],[0x08,0x14,0x14,0x7C,0x00],[0x7C,0x08,0x04,0x04,0x08],[0x48,0x54,0x54,0x54,0x20],
[0x04,0x3F,0x44,0x40,0x20],[0x3C,0x40,0x40,0x20,0x7C],[0x1C,0x20,0x40,0x20,0x1C],[0x3C,0x40,0x30,0x40,0x3C],
[0x44,0x28,0x10,0x28,0x44],[0x0C,0x50,0x50,0x50,0x3C],[0x44,0x64,0x54,0x4C,0x44],[0x00,0x08,0x36,0x41,0x00],
[0x00,0x00,0x7F,0x00,0x00],[0x00,0x41,0x36,0x08,0x00],[0x08,0x08,0x2A,0x1C,0x08]
];

const S = 5, W = 128, H = 64;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function px(x,y,color){
  if(x<0||x>=W||y<0||y>=H) return;
  ctx.fillStyle=color;
  ctx.fillRect(x*S, y*S, S, S);
}
function line(x0,y0,x1,y1,color){
  // Bresenham（和你驱动里一样），保证线连续
  let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  let sx=x0<x1?1:-1, sy=y0<y1?1:-1, err=dx-dy;
  while(true){
    px(x0,y0,color);
    if(x0===x1&&y0===y1) break;
    let e2=2*err;
    if(e2>-dy){err-=dy;x0+=sx;}
    if(e2<dx){err+=dx;y0+=sy;}
  }
}
function textBounds(str,cx,cy){
  let n=str.length;
  return {L:cx, R:cx+6*n-1, T:cy, B:cy+6};
}
function drawText(str,cx,cy,color){
  let x=cx;
  for(const ch of str){
    let code=ch.charCodeAt(0);
    if(code>=97&&code<=122) code-=32;
    if(code<0x20||code>0x7E) code=0x20;
    const g=Font5x7[code-0x20];
    for(let col=0;col<5;col++)
      for(let row=0;row<7;row++)
        if(g[col]&(1<<row)) px(x+col,cy+row,color);
    x+=6;
  }
}

function render(){
  const cx=+document.getElementById('sx').value;
  const cy=+document.getElementById('sy').value;
  document.getElementById('vx').textContent=cx;
  document.getElementById('vy').textContent=cy;

  // 背景
  ctx.fillStyle='#000'; ctx.fillRect(0,0,cv.width,cv.height);

  // 网格线（灰白）
  const grid=[[0,0,127,0],[0,0,0,63],[0,63,127,63],[127,0,127,63],[42,0,42,63],[42,31,127,31]];
  grid.forEach(l=>line(l[0],l[1],l[2],l[3],'#9a9a9a'));

  // 原代码位置 (44,2) 残影
  drawText('HELLO WORD!',44,2,'#555');

  // 当前光标文字
  drawText('HELLO WORD!',cx,cy,'#ffffff');

  // 包围框
  const b=textBounds('HELLO WORD!',cx,cy);
  ctx.strokeStyle='#fa3'; ctx.lineWidth=1;
  ctx.strokeRect(b.L*S, b.T*S, (b.R-b.L+1)*S, (b.B-b.T+1)*S);

  // 格子中心十字 (84.5,15.5)
  ctx.strokeStyle='#2ce'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(84*S,15*S); ctx.lineTo(85*S,16*S);
  ctx.moveTo(85*S,15*S); ctx.lineTo(84*S,16*S);
  ctx.stroke();
  line(80,15,89,15,'#2ce'); line(84,11,84,20,'#2ce');

  // 数据面板
  document.getElementById('tL').textContent=b.L;
  document.getElementById('tR').textContent=b.R;
  document.getElementById('tT').textContent=b.T;
  document.getElementById('tB').textContent=b.B;
  const mL=b.L-42, mR=127-b.R, mT=b.T-0, mB=31-b.B;
  function cell(id,v){const e=document.getElementById(id); e.textContent=v+' px'; e.className=(v>=0&&v<=1)?'ok':'bad';}
  cell('mL',mL); cell('mR',mR); cell('mT',mT); cell('mB',mB);
}

document.getElementById('sx').addEventListener('input',render);
document.getElementById('sy').addEventListener('input',render);
document.getElementById('center').addEventListener('click',()=>{
  document.getElementById('sx').value=52;
  document.getElementById('sy').value=12;
  render();
});
render();
</script>
</body>
</html>
